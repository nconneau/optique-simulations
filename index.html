<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulations d'Optique Géométrique</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      width: 100%;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      text-align: center;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 25px;
      color: #0f172a;
    }
    .menu-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    a.btn {
      display: block;
      background-color: #2563eb;
      color: white;
      text-decoration: none;
      padding: 15px 20px;
      border-radius: 8px;
      font-weight: 600;
      transition: background-color 0.2s;
    }
    a.btn:hover {
      background-color: #1d4ed8;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Optique Géométrique : Les Plans Focaux</h1>
    <div class="menu-list">
      <a href="focal-image.html" class="btn">Plan focal image (Rayons incidents parallèles)</a>
      <a href="focal-objet.html" class="btn">Plan focal objet (Rayons issus d'un point focal)</a>
    </div>
  </div>

</html>
