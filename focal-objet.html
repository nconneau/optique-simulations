<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plan Focal Objet d'une Lentille Convergente</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f8fafc;
      color: #1e293b;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      background: #f1f5f9;
      padding: 15px;
      border-radius: 8px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .control-group label {
      font-size: 0.875rem;
      font-weight: 600;
      color: #475569;
      display: flex;
      justify-content: space-between;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #2563eb;
    }

    .canvas-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      overflow: hidden;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
    }

    canvas:active {
      cursor: grabbing;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="controls">
      <div class="control-group">
        <label for="angle">Angle de sortie (&theta;) : <span id="angleVal">0°</span></label>
        <input type="range" id="angle" min="-25" max="25" step="0.5" value="0">
      </div>
      <div class="control-group">
        <label for="focal">Distance focale (f) : <span id="focalVal">4.3</span></label>
        <input type="range" id="focal" min="2" max="6" step="0.1" value="4.3">
      </div>
      <div class="control-group">
        <label for="rayCount">Nombre de rayons : <span id="rayCountVal">5</span></label>
        <input type="range" id="rayCount" min="3" max="9" step="2" value="5">
      </div>
    </div>

    <div class="canvas-container">
      <canvas id="opticsCanvas"></canvas>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('opticsCanvas');
    const ctx = canvas.getContext('2d');

    // Controls
    const angleInput = document.getElementById('angle');
    const focalInput = document.getElementById('focal');
    const rayCountInput = document.getElementById('rayCount');

    const angleVal = document.getElementById('angleVal');
    const focalVal = document.getElementById('focalVal');
    const rayCountVal = document.getElementById('rayCountVal');

    // Setup High-DPI Canvas
    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
      draw();
    }

    window.addEventListener('resize', resizeCanvas);

    // Event Listeners
    angleInput.addEventListener('input', (e) => {
      angleVal.textContent = `${e.target.value}°`;
      draw();
    });

    focalInput.addEventListener('input', (e) => {
      focalVal.textContent = e.target.value;
      draw();
    });

    rayCountInput.addEventListener('input', (e) => {
      rayCountVal.textContent = e.target.value;
      draw();
    });

    // Drag to rotate angle
    let isDragging = false;
    let startY = 0;
    let startAngle = 0;

    canvas.addEventListener('mousedown', (e) => {
      isDragging = true;
      startY = e.clientY;
      startAngle = parseFloat(angleInput.value);
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const deltaY = e.clientY - startY;
      let newAngle = startAngle + deltaY * 0.2;
      newAngle = Math.max(-25, Math.min(25, newAngle));
      angleInput.value = newAngle.toFixed(1);
      angleVal.textContent = `${parseFloat(angleInput.value)}°`;
      draw();
    });

    window.addEventListener('mouseup', () => { isDragging = false; });

    // Helper: Draw Arrowhead
    function drawArrowhead(x, y, angle, color) {
      const headlen = 8;
      ctx.save();
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x - headlen * Math.cos(angle - Math.PI / 6), y - headlen * Math.sin(angle - Math.PI / 6));
      ctx.lineTo(x - headlen * Math.cos(angle + Math.PI / 6), y - headlen * Math.sin(angle + Math.PI / 6));
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function draw() {
      const w = canvas.getBoundingClientRect().width;
      const h = canvas.getBoundingClientRect().height;

      ctx.clearRect(0, 0, w, h);

      // System Coordinates Transformation
      const originX = w * 0.52;
      const originY = h * 0.5;
      const scale = w / 18; // 1 unit = scale pixels

      const thetaDeg = parseFloat(angleInput.value);
      const theta = (thetaDeg * Math.PI) / 180;
      const f = parseFloat(focalInput.value);
      const numRays = parseInt(rayCountInput.value);

      // 1. Draw Optical Axis
      ctx.beginPath();
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 1;
      ctx.moveTo(0, originY);
      ctx.lineTo(w, originY);
      ctx.stroke();

      // Graduations
      ctx.font = '11px sans-serif';
      ctx.fillStyle = '#475569';
      ctx.textAlign = 'center';

      for (let i = -8; i <= 8; i++) {
        if (i === 0) continue;
        const x = originX + i * scale;
        ctx.beginPath();
        ctx.moveTo(x, originY - 4);
        ctx.lineTo(x, originY + 4);
        ctx.stroke();
        ctx.fillText(Math.abs(i).toString(), x, originY + 16);
      }

      // 2. Main Foci Labels (F and F')
      const xF = originX - f * scale;
      const xFPrime = originX + f * scale;

      // Point F
      ctx.beginPath();
      ctx.arc(xF, originY, 3, 0, Math.PI * 2);
      ctx.fillStyle = '#000';
      ctx.fill();
      ctx.fillText('F', xF - 10, originY + 18);

      // Point F'
      ctx.beginPath();
      ctx.arc(xFPrime, originY, 3, 0, Math.PI * 2);
      ctx.fillStyle = '#000';
      ctx.fill();
      ctx.fillText("F'", xFPrime + 10, originY - 10);

      // 3. Focal Plane Object (Dashed Line at F)
      ctx.save();
      ctx.setLineDash([5, 5]);
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(xF, 20);
      ctx.lineTo(xF, h - 20);
      ctx.stroke();
      ctx.restore();

      // Focal Plane Label
      ctx.fillStyle = '#1e293b';
      ctx.font = '12px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Plan focal', xF, h - 35);
      ctx.fillText('objet', xF, h - 20);

      // 4. Secondary Focal Point (phi)
      const phiY = originY - f * scale * Math.tan(theta);

      // 5. Draw Converging Lens
      const lensHeight = h * 0.85;
      const lensWidth = 24;

      ctx.save();
      ctx.beginPath();
      ctx.moveTo(originX, originY - lensHeight / 2);
      ctx.quadraticCurveTo(originX + lensWidth, originY, originX, originY + lensHeight / 2);
      ctx.quadraticCurveTo(originX - lensWidth, originY, originX, originY - lensHeight / 2);

      const gradient = ctx.createLinearGradient(originX - lensWidth, 0, originX + lensWidth, 0);
      gradient.addColorStop(0, 'rgba(203, 213, 225, 0.6)');
      gradient.addColorStop(0.5, 'rgba(241, 245, 249, 0.8)');
      gradient.addColorStop(1, 'rgba(148, 163, 184, 0.6)');

      ctx.fillStyle = gradient;
      ctx.fill();
      ctx.strokeStyle = '#64748b';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.restore();

      // 6. Draw Rays
      const spacing = 45;
      const midIndex = Math.floor(numRays / 2);

      for (let i = 0; i < numRays; i++) {
        const offset = (i - midIndex) * spacing;
        const isCenterRay = (i === midIndex);

        const yLens = originY + offset;
        const rayColor = isCenterRay ? '#dc2626' : '#2563eb';
        const rayWidth = isCenterRay ? 1.8 : 1.2;

        ctx.strokeStyle = rayColor;
        ctx.lineWidth = rayWidth;

        // --- Incident Rays ---
        // Extension backwards from phi
        const incidentAngle = Math.atan2(yLens - phiY, originX - xF);
        const xStart = 0;
        const yStart = phiY - (xF - xStart) * Math.tan(incidentAngle);

        ctx.beginPath();
        ctx.moveTo(xStart, yStart);
        ctx.lineTo(originX, yLens);
        ctx.stroke();

        // Arrow on incident ray (before lens)
        const arrowX1 = xF - (xF - xStart) * 0.5;
        const arrowY1 = phiY - (xF - arrowX1) * Math.tan(incidentAngle);
        drawArrowhead(arrowX1, arrowY1, incidentAngle, rayColor);

        // --- Emergent Rays ---
        const xEnd = w;
        const yEnd = yLens + (xEnd - originX) * Math.tan(theta);

        ctx.beginPath();
        ctx.moveTo(originX, yLens);
        ctx.lineTo(xEnd, yEnd);
        ctx.stroke();

        // Arrow on emergent ray
        const arrowX2 = originX + (w - originX) * 0.4;
        const arrowY2 = yLens + (arrowX2 - originX) * Math.tan(theta);
        drawArrowhead(arrowX2, arrowY2, theta, rayColor);

        // Label on Central Red Ray
        if (isCenterRay) {
          ctx.fillStyle = '#dc2626';
          ctx.font = '12px sans-serif';
          ctx.textAlign = 'left';
          ctx.fillText('Axe secondaire', xStart + 20, yStart - 10);
        }
      }

      // Red dot phi (Foyer secondaire objet)
      ctx.beginPath();
      ctx.arc(xF, phiY, 5, 0, Math.PI * 2);
      ctx.fillStyle = '#dc2626';
      ctx.fill();

      // Label phi
      ctx.fillStyle = '#dc2626';
      ctx.font = 'bold 16px serif';
      ctx.textAlign = 'left';
      ctx.fillText('φ', xF + 8, phiY - 5);
    }

    // Initial Load
    resizeCanvas();
  </script>
</body>
</html>
